<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="手づくりステンドグラス作品の小さなアトリエ、Glass Atelier。">
  <title>Glass Atelier | 手のひらに、光のかけらを。</title>
  <style>
    :root { --ink:#3e382f; --cream:#fbf7ee; --paper:#fffdf8; --terracotta:#a96f4a; --sage:#829176; --line:#ded4c4; }
    * { box-sizing:border-box; } html { scroll-behavior:smooth; } body { margin:0; background:var(--cream); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:15px; line-height:1.8; } a { color:inherit; text-decoration:none; } img { display:block; width:100%; object-fit:cover; }
    .site-header { height:94px; padding:0 max(5vw,26px); display:flex; align-items:center; justify-content:space-between; background:rgba(255,253,248,.95); position:sticky; top:0; z-index:10; } .brand { display:flex; flex-direction:column; line-height:1.1; } .brand span { font-family:Georgia,"Times New Roman",serif; letter-spacing:.03em; font-size:27px; } .brand small { font-size:10px; letter-spacing:.12em; margin-top:7px; } .nav { display:flex; gap:29px; font-size:13px; } .nav a { position:relative; cursor:pointer; } .nav a::after { content:""; position:absolute; width:0; height:1px; background:var(--terracotta); bottom:-7px; left:0; transition:.2s; } .nav a:hover::after,.nav a.selected::after { width:100%; } .menu-button { display:none; background:none; border:0; font-size:28px; color:var(--ink); }
    .hero { min-height:610px; display:grid; grid-template-columns:1fr 1.05fr; background:#ece4d5; } .hero-copy { display:flex; flex-direction:column; justify-content:center; padding:7vw max(5vw,26px); } .eyebrow { font-size:11px; letter-spacing:.16em; color:var(--terracotta); margin:0 0 13px; } h1,h2 { font-family:Georgia,"Times New Roman","Hiragino Mincho ProN",serif; font-weight:400; line-height:1.35; } .hero h1 { font-size:clamp(38px,5vw,65px); margin:0 0 22px; } .hero-copy>p:not(.eyebrow) { max-width:400px; margin:0 0 32px; } .hero-image img { height:100%; min-height:610px; } .button { display:inline-block; background:var(--terracotta); color:#fff; border:0; padding:13px 26px; font:inherit; font-size:13px; letter-spacing:.08em; cursor:pointer; transition:.2s; width:max-content; } .button:hover { background:#8e5739; transform:translateY(-2px); }
    .section { max-width:1200px; margin:auto; padding:100px max(5vw,26px); } .section-heading { text-align:center; margin-bottom:43px; } .section-heading h2 { font-size:34px; margin:0; } .section-heading p { margin:5px 0 0; font-size:13px; color:#766e63; } .product-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; } .product-card { background:var(--paper); transition:.25s; } .product-card:hover { transform:translateY(-5px); box-shadow:0 10px 30px #8c79651a; } .product-card img { aspect-ratio:1/1.15; } .card-body { padding:17px 18px 20px; } .card-body .eyebrow { margin-bottom:3px; font-size:10px; } .card-body h3 { font-size:14px; font-weight:500; margin:0; } .price { margin:8px 0 0; font-size:13px; }.intro { background:#dfe4d7; text-align:center; padding:100px 26px; }.intro p { max-width:560px; margin:15px auto 26px; }
    .page-hero { padding:82px 26px 70px; text-align:center; background:#ece4d5; }.page-hero h1 { font-size:43px; margin:5px 0; }.page-hero p { margin:0; color:#6f665c; font-size:14px; }.filters { display:flex; justify-content:center; gap:9px; flex-wrap:wrap; margin-bottom:38px; }.filters button { border:1px solid var(--line); background:var(--paper); padding:8px 15px; color:var(--ink); font:inherit; font-size:12px; cursor:pointer; }.filters button.active,.filters button:hover { background:var(--sage); border-color:var(--sage); color:#fff; }
    .detail { max-width:1080px; margin:auto; padding:75px max(5vw,26px); display:grid; grid-template-columns:1.08fr .92fr; gap:68px; }.detail-image img { aspect-ratio:.88; }.detail-copy h1 { font-size:38px; margin:4px 0 8px; }.detail-price { font-size:22px; margin:0 0 28px; }.detail-price small { font-size:11px; margin-left:6px; }.detail-description { margin-bottom:30px; } dl { border-top:1px solid var(--line); margin:0 0 32px; } dl div { display:grid; grid-template-columns:85px 1fr; border-bottom:1px solid var(--line); padding:12px 0; font-size:13px; } dt { color:#766e63; } dd { margin:0; }.note { font-size:11px; color:#766e63; }
    .about { max-width:1040px; margin:auto; padding:80px max(5vw,26px); display:grid; grid-template-columns:1fr 1fr; gap:70px; align-items:center; }.about img { aspect-ratio:.9; }.about h1 { font-size:42px; margin:4px 0 20px; }.about .signature { font-family:Georgia,serif; font-size:25px; margin-top:25px; }.contact { max-width:720px; margin:auto; padding:75px max(5vw,26px); }.contact h1 { text-align:center; font-size:42px; margin:5px 0 10px; }.contact>p { text-align:center; margin-bottom:36px; } form { background:var(--paper); padding:36px; } label { font-size:13px; display:block; margin-bottom:17px; } input,textarea { display:block; width:100%; margin-top:6px; padding:11px; border:1px solid var(--line); background:#fffdf9; font:inherit; font-size:14px; } textarea { height:150px; resize:vertical; } form .button { margin-top:5px; } #form-message { text-align:left; color:var(--sage); font-weight:600; margin:17px 0 0; }
    footer { background:#554c42; color:#f7f1e6; padding:52px max(5vw,26px) 30px; } footer .brand span { font-size:25px; } footer p { font-size:12px; color:#ded6c9; margin:19px 0; }.copyright { border-top:1px solid #71675d; padding-top:18px; margin-top:32px!important; font-size:10px; }
    @media(max-width:700px) { .site-header { height:76px; }.brand span { font-size:23px; }.nav { display:none; position:absolute; top:76px; left:0; right:0; background:var(--paper); padding:14px 26px 22px; box-shadow:0 10px 18px #473d3315; flex-direction:column; gap:10px; }.nav.open { display:flex; }.menu-button { display:block; }.hero { grid-template-columns:1fr; }.hero-copy { min-height:435px; padding-top:70px; padding-bottom:55px; }.hero h1 { font-size:42px; }.hero-image img { min-height:0; height:380px; }.section { padding-top:72px; padding-bottom:72px; }.product-grid { grid-template-columns:repeat(2,1fr); gap:12px; }.card-body { padding:12px; }.card-body h3 { font-size:13px; }.intro { padding:70px 26px; }.page-hero { padding:57px 25px; }.page-hero h1,.contact h1 { font-size:36px; }.detail { grid-template-columns:1fr; gap:30px; padding-top:48px; }.detail-copy h1 { font-size:33px; }.about { grid-template-columns:1fr; gap:35px; padding-top:50px; }.about h1 { font-size:36px; }.about img { max-height:470px; }.contact { padding-top:55px; } form { padding:23px 18px; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const products = [
      {id:'lamp-01',category:'lamp',categoryLabel:'ランプ',name:'木漏れ日のテーブルランプ',price:'¥18,000',image:'https://images.unsplash.com/photo-1540932239986-30128078f3c5?auto=format&fit=crop&w=1200&q=85',description:'やわらかな琥珀色と緑のガラスを組み合わせた、夕暮れのような小さなランプです。',size:'幅18 × 高さ26cm',material:'ガラス、はんだ、木製ベース'},
      {id:'lamp-02',category:'lamp',categoryLabel:'ランプ',name:'夜空のペンダントライト',price:'¥22,000',image:'https://images.unsplash.com/photo-1543198126-22a1e7e308c1?auto=format&fit=crop&w=1200&q=85',description:'深い青と乳白色のガラスが、穏やかな光を灯す一点ものです。',size:'幅20 × 高さ18cm',material:'ガラス、はんだ、コード'},
      {id:'accessory-01',category:'accessory',categoryLabel:'アクセサリー',name:'花びらのピアス',price:'¥3,800',image:'https://images.unsplash.com/photo-1617038260897-41a1f14a8ca0?auto=format&fit=crop&w=1200&q=85',description:'光を受けてきらめく、小さな花びらのピアス。軽やかな着け心地です。',size:'約1.8 × 2.5cm',material:'ガラス、真鍮、サージカルステンレス'},
      {id:'accessory-02',category:'accessory',categoryLabel:'アクセサリー',name:'海のかけら ブローチ',price:'¥4,200',image:'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=1200&q=85',description:'波間を思わせるブルーのガラスを閉じ込めたブローチです。',size:'約3.5 × 3cm',material:'ガラス、真鍮'},
      {id:'interior-01',category:'interior',categoryLabel:'インテリア',name:'小鳥のオーナメント',price:'¥5,500',image:'https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=1200&q=85',description:'窓辺や棚の小さなアクセントになる、愛らしい小鳥の置物です。',size:'幅11 × 高さ8cm',material:'ガラス、はんだ'},
      {id:'interior-02',category:'interior',categoryLabel:'インテリア',name:'野花の一輪挿し',price:'¥6,800',image:'https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=1200&q=85',description:'一輪の草花が美しく映える、窓辺のためのガラスベースです。',size:'幅10 × 高さ16cm',material:'ガラス、はんだ、試験管'},
      {id:'sun-01',category:'suncatcher',categoryLabel:'サンキャッチャー',name:'朝露のサンキャッチャー',price:'¥4,800',image:'https://images.unsplash.com/photo-1527482797697-8795b05a13fe?auto=format&fit=crop&w=1200&q=85',description:'朝の光を小さな虹に変える、透明感のあるサンキャッチャーです。',size:'全長約28cm',material:'ガラス、真鍮チェーン'},
      {id:'sun-02',category:'suncatcher',categoryLabel:'サンキャッチャー',name:'月と星のモビール',price:'¥7,200',image:'https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=1200&q=85',description:'風に揺れるたび、窓辺にやさしい光の表情をつくります。',size:'幅18 × 全長35cm',material:'ガラス、真鍮チェーン'}
    ];
    const app = document.querySelector('#app');
    const pageNames = {home:'ホーム',products:'作品一覧',product:'作品詳細',about:'作家について',contact:'お問い合わせ'};
    function route() { const [page='home', id] = location.hash.replace(/^#\/?/,'').split('/'); return {page:pageNames[page] ? page : 'home', id}; }
    function header(page) { return `<header class="site-header"><a class="brand" href="#/home"><span>Glass Atelier</span><small>手のひらに、光のかけらを。</small></a><button class="menu-button" aria-label="メニューを開く" aria-expanded="false">☰</button><nav class="nav"><a class="${page==='home'?'selected':''}" href="#/home">ホーム</a><a class="${page==='products'?'selected':''}" href="#/products">作品一覧</a><a class="${page==='about'?'selected':''}" href="#/about">作家について</a><a class="${page==='contact'?'selected':''}" href="#/contact">お問い合わせ</a></nav></header>`; }
    function footer() { return `<footer><a class="brand" href="#/home"><span>Glass Atelier</span><small>手のひらに、光のかけらを。</small></a><p>一枚のガラスから、暮らしに小さなときめきを。</p><p class="copyright">© Glass Atelier</p></footer>`; }
    function card(p) { return `<article class="product-card"><a href="#/product/${p.id}"><img src="${p.image}" alt="${p.name}" loading="lazy"><div class="card-body"><p class="eyebrow">${p.categoryLabel}</p><h3>${p.name}</h3><p class="price">${p.price}</p></div></a></article>`; }
    function home() { return `<main><section class="hero"><div class="hero-copy"><p class="eyebrow">HANDMADE STAINED GLASS</p><h1>暮らしに、<br>光の小さな物語を。</h1><p>一枚一枚表情の違うガラスを選び、光を透かして生まれる美しさを、丁寧にかたちにしています。</p><a class="button" href="#/products">作品を見る</a></div><div class="hero-image"><img src="https://images.unsplash.com/photo-1540932239986-30128078f3c5?auto=format&fit=crop&w=1600&q=90" alt="やわらかな光を灯すステンドグラスランプ"></div></section><section class="section"><div class="section-heading"><p class="eyebrow">COLLECTION</p><h2>作品を選ぶ</h2><p>光とともに、日々の景色に寄り添うもの。</p></div><div class="product-grid">${products.slice(0,4).map(card).join('')}</div><p style="text-align:center;margin-top:38px"><a class="button" href="#/products">すべての作品を見る</a></p></section><section class="intro"><p class="eyebrow">ABOUT THE ATELIER</p><h2>ガラスの向こうにある、<br>やさしい時間。</h2><p>窓から差し込む光、季節の草花、旅先で出会った色。そんな日々の小さな発見を、ステンドグラスに映しています。</p><a class="button" href="#/about">作家について</a></section></main>`; }
    function productsPage() { return `<main><section class="page-hero"><p class="eyebrow">COLLECTION</p><h1>作品一覧</h1><p>日々の暮らしに寄り添う、光のかけらたち。</p></section><section class="section"><div class="filters"><button class="active" data-filter="all">すべて</button><button data-filter="lamp">ランプ</button><button data-filter="accessory">アクセサリー</button><button data-filter="interior">インテリア</button><button data-filter="suncatcher">サンキャッチャー</button></div><div id="product-grid" class="product-grid">${products.map(card).join('')}</div></section></main>`; }
    function detail(id) { const p = products.find(x=>x.id===id) || products[0]; document.title=`${p.name} | Glass Atelier`; return `<main><section class="detail"><div class="detail-image"><img src="${p.image}" alt="${p.name}"></div><div class="detail-copy"><p class="eyebrow">${p.categoryLabel}</p><h1>${p.name}</h1><p class="detail-price">${p.price}<small>（税込）</small></p><p class="detail-description">${p.description}</p><dl><div><dt>サイズ</dt><dd>${p.size}</dd></div><div><dt>素材</dt><dd>${p.material}</dd></div><div><dt>制作</dt><dd>一点ずつ手作業で制作しています</dd></div></dl><a class="button" href="#/contact/${p.id}">この作品について相談する</a><p class="note">※ 現在は試作サイトのため、ご購入はお問い合わせにて承ります。</p></div></section></main>`; }
    function about() { return `<main><section class="about"><img src="https://images.unsplash.com/photo-1452860606245-08befc0ff44b?auto=format&fit=crop&w=1000&q=85" alt="アトリエの制作風景"><div><p class="eyebrow">ABOUT THE ARTIST</p><h1>作家について</h1><p>はじめまして、Glass Atelierの作り手です。ガラスを通る光の美しさに惹かれ、身近な暮らしの中で楽しめる作品を制作しています。</p><p>ガラス選びからカット、研磨、はんだ付けまで、すべての工程を手作業で。一つとして同じ表情のない素材だからこそ生まれる、偶然のきらめきを大切にしています。</p><p>手に取った方の毎日に、ふと心がほどけるような時間をお届けできますように。</p><p class="signature">Glass Atelier</p></div></section></main>`; }
    function contact(id) { const p=products.find(x=>x.id===id); return `<main><section class="contact"><p class="eyebrow">CONTACT</p><h1>お問い合わせ</h1><p>作品についてのご質問や、オーダーのご相談など、お気軽にお知らせください。</p><form><label>お名前<input required name="name" autocomplete="name"></label><label>メールアドレス<input required type="email" name="email" autocomplete="email"></label><label>件名<input required name="subject" value="${p?`${p.name}について`:''}"></label><label>お問い合わせ内容<textarea required name="message"></textarea></label><button class="button" type="submit">送信する</button><p id="form-message" aria-live="polite"></p></form></section></main>`; }
    function render() { const {page,id}=route(); document.title=page==='home'?'Glass Atelier | 手のひらに、光のかけらを。':`${page} | Glass Atelier`; const content={home:home(),products:productsPage(),product:detail(id),about:about(),contact:contact(id)}[page]; app.innerHTML=header(page)+content+footer(); const menu=document.querySelector('.menu-button'),nav=document.querySelector('.nav'); menu.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',open);menu.textContent=open?'×':'☰';}); document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#product-grid').innerHTML=products.filter(p=>b.dataset.filter==='all'||p.category===b.dataset.filter).map(card).join('');})); const form=document.querySelector('form'); if(form)form.addEventListener('submit',e=>{e.preventDefault();document.querySelector('#form-message').textContent='お問い合わせありがとうございます。内容を確認のうえ、ご連絡いたします。';e.target.reset();}); }
    addEventListener('hashchange',render); render();
  </script>
</body>
</html>
